name: SourceBounty CI

on:
  push:
  pull_request:

jobs:
  contract-and-frontend:
    runs-on: ubuntu-24.04
    env:
      GENVM_VERSION: v0.2.16
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned Python tools
        run: python -m pip install -r requirements-ci.txt
      - name: Fetch pinned GenVM runner bundle
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          curl --fail --location --retry 3 \
            https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz \
            --output "$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz"
          echo '4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2  '"$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz" | sha256sum --check
          mkdir -p "$HOME/.cache/genvm-linter"
          cp "$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz" \
            "$HOME/.cache/genvm-linter/genvm-universal-v0.2.16.tar.xz"
      - name: Validate contract and safety rules
        run: genvm-lint check contracts/source_bounty.py
      - name: Run complete direct test suite
        run: python -m pytest tests/direct -q
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
