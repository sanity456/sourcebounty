name: SourceBounty CI

on:
  push:
  pull_request:

jobs:
  contract-and-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned Python tools
        run: python -m pip install -r requirements-ci.txt
      - name: Lint contract safety rules
        run: genvm-lint lint contracts/source_bounty.py
      - name: Run complete direct test suite
        run: python -m pytest tests/direct -q
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
